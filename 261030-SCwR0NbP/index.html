<!doctype html><html lang="ko"><head><meta charset="utf-8">
<meta name="robots" content="noindex,nofollow"><title>실적 이미지 10/30 훈</title>
<style>
body{font-family:'Malgun Gothic',sans-serif;background:#f6f6f4;color:#37352f;margin:0;padding:24px}
h1{font-size:20px;margin:0 0 4px} p{margin:0 0 16px;color:#787774}
#all{font-size:15px;padding:8px 18px;border:0;border-radius:6px;background:#2383e2;color:#fff;cursor:pointer}
#msg{margin-left:12px;color:#448361}
.grid{display:flex;flex-wrap:wrap;gap:16px;margin-top:20px}
.card{background:#fff;border:1px solid #e3e2e0;border-radius:6px;padding:8px;width:300px}
.card img{width:100%;display:block} .card a{font-size:14px;color:#37352f}
</style></head><body>
<h1>실적 이미지 10/30 훈</h1><p>11개 파일 · 크롬이 '여러 파일 다운로드'를 물으면 [허용]을 눌러 주세요</p>
<button id="all">다시 받기</button><span id="msg"></span>
<div class="grid"><div class="card"><img src="01.png" alt=""><a href="01.png" download="01_제이브이엠(잠정).png">01_제이브이엠(잠정).png</a></div><div class="card"><img src="02.png" alt=""><a href="02.png" download="02_종근당바이오(잠정).png">02_종근당바이오(잠정).png</a></div><div class="card"><img src="03.png" alt=""><a href="03.png" download="03_LG씨엔에스(잠정).png">03_LG씨엔에스(잠정).png</a></div><div class="card"><img src="04.png" alt=""><a href="04.png" download="04_효성ITX (잠정).png">04_효성ITX (잠정).png</a></div><div class="card"><img src="05.png" alt=""><a href="05.png" download="05_녹십자엠에스 (잠정).png">05_녹십자엠에스 (잠정).png</a></div><div class="card"><img src="06.png" alt=""><a href="06.png" download="06_지씨셀(잠정).png">06_지씨셀(잠정).png</a></div><div class="card"><img src="07.png" alt=""><a href="07.png" download="07_경보제약(잠정).png">07_경보제약(잠정).png</a></div><div class="card"><img src="08.png" alt=""><a href="08.png" download="08_지구홀딩스(X)(26년2분기정정).png">08_지구홀딩스(X)(26년2분기정정).png</a></div><div class="card"><img src="09.png" alt=""><a href="09.png" download="09_현대오토에버(잠정).png">09_현대오토에버(잠정).png</a></div><div class="card"><img src="10.png" alt=""><a href="10.png" download="10_두산퓨얼셀 (261028, 잠정)(잠정).png">10_두산퓨얼셀 (261028, 잠정)(잠정).png</a></div><div class="card"><img src="11.png" alt=""><a href="11.png" download="11_큐리옥스바이오시스템즈 (261027, 잠정)(잠정).png">11_큐리옥스바이오시스템즈 (261027, 잠정)(잠정).png</a></div></div>
<script>
const files = [["01.png", "01_제이브이엠(잠정).png"], ["02.png", "02_종근당바이오(잠정).png"], ["03.png", "03_LG씨엔에스(잠정).png"], ["04.png", "04_효성ITX (잠정).png"], ["05.png", "05_녹십자엠에스 (잠정).png"], ["06.png", "06_지씨셀(잠정).png"], ["07.png", "07_경보제약(잠정).png"], ["08.png", "08_지구홀딩스(X)(26년2분기정정).png"], ["09.png", "09_현대오토에버(잠정).png"], ["10.png", "10_두산퓨얼셀 (261028, 잠정)(잠정).png"], ["11.png", "11_큐리옥스바이오시스템즈 (261027, 잠정)(잠정).png"]];
const all = async () => {
  for (const [src, name] of files) {
    const a = document.createElement('a'); a.href = src; a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    await new Promise(r => setTimeout(r, 400));
  }
  document.getElementById('msg').textContent = files.length + '개 다운로드를 시작했습니다';
};
document.getElementById('all').onclick = all;
window.addEventListener('load', all);   // 열자마자 바로 받기
</script></body></html>
